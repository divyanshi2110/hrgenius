services:
  backend:
    build:
      context: ./hrgenius-backend
      dockerfile: Dockerfile
    container_name: hrgenius-backend
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      SPRING_PROFILES_ACTIVE: cloud
      CORS_ALLOWED_ORIGINS: "http://localhost:4200,http://localhost:80,http://localhost"
    restart: unless-stopped

  frontend:
    build:
      context: ./hrgenius-frontend
      dockerfile: Dockerfile
    container_name: hrgenius-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
