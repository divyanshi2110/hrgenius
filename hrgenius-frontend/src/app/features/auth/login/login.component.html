<div class="login-wrapper">
  <!-- Rounded Frame Matching Screenshot -->
  <div class="login-frame">
    
    <!-- LEFT PANEL: Only the animated illustration -->
    <div class="left-panel">
      <div class="illustration-container">
        @if (!imageError()) {
          <img 
            [src]="illustrationUrl" 
            alt="Workplace Illustration" 
            class="illustration-img"
            (error)="handleImageError($event)"
          />
        } @else {
          <!-- Fallback Workplace SVG Illustration if image fails to load -->
          <svg viewBox="0 0 448 355" class="illustration-img" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="448" height="355" rx="16" fill="#f1f5f9"/>
            <rect x="24" y="24" width="400" height="230" rx="12" fill="#e2e8f0" fill-opacity="0.5"/>
            <rect x="44" y="44" width="80" height="90" rx="8" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
            <line x1="84" y1="44" x2="84" y2="134" stroke="#94a3b8" stroke-width="2"/>
            <line x1="44" y1="89" x2="124" y2="89" stroke="#94a3b8" stroke-width="2"/>
            <rect x="60" y="240" width="328" height="12" rx="4" fill="#0f172a"/>
            <rect x="90" y="252" width="16" height="70" fill="#334155"/>
            <rect x="342" y="252" width="16" height="70" fill="#334155"/>
            <rect x="174" y="160" width="100" height="68" rx="6" fill="#1e293b"/>
            <rect x="180" y="166" width="88" height="56" rx="4" fill="#2563eb"/>
            <rect x="190" y="176" width="40" height="6" rx="2" fill="#ffffff" fill-opacity="0.8"/>
            <rect x="190" y="186" width="60" height="4" rx="2" fill="#93c5fd"/>
            <rect x="190" y="194" width="50" height="4" rx="2" fill="#93c5fd"/>
            <circle cx="250" cy="182" r="5" fill="#34d399"/>
            <rect x="218" y="228" width="12" height="12" fill="#475569"/>
            <rect x="204" y="238" width="40" height="4" rx="2" fill="#334155"/>
            <rect x="310" y="215" width="22" height="25" rx="3" fill="#d97706"/>
            <circle cx="135" cy="180" r="22" fill="#f87171"/>
            <circle cx="135" cy="172" r="16" fill="#fbcfe8"/>
            <path d="M110 240 C110 205 160 205 160 240 Z" fill="#2563eb"/>
            <rect x="145" y="140" width="60" height="24" rx="6" fill="#ffffff"/>
            <text x="151" y="156" font-family="-apple-system, sans-serif" font-size="10" font-weight="bold" fill="#2563eb">HRGenius</text>
          </svg>
        }
      </div>
    </div>

    <!-- RIGHT PANEL: Clean Sign In Form -->
    <div class="right-panel">
      <div class="form-header">
        <h1 class="form-title">Sign In to your account</h1>
      </div>

      <!-- Error Alert -->
      @if (errorMessage()) {
        <div class="alert alert-danger">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="alert-icon">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <!-- Form Inputs -->
      <form (ngSubmit)="handleLogin()" class="auth-form">
        <div class="field-group">
          <label class="field-label">Email or Username</label>
          <input 
            type="text" 
            class="field-input" 
            [(ngModel)]="username" 
            name="username" 
            placeholder="Enter email or username" 
            required
          />
        </div>

        <div class="field-group">
          <label class="field-label">Password</label>
          <div class="input-with-eye">
            <input 
              [type]="showPassword() ? 'text' : 'password'" 
              class="field-input pr-eye" 
              [(ngModel)]="password" 
              name="password" 
              placeholder="Enter password" 
              required
            />
            <button 
              type="button" 
              class="eye-btn" 
              (click)="togglePasswordVisibility()" 
              title="Toggle password visibility"
              [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
            >
              @if (showPassword()) {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="eye-icon">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              } @else {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="eye-icon">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              }
            </button>
          </div>
        </div>

        <!-- Solid Brand Blue Button Matching Inside Portal Contrast -->
        <button 
          type="submit" 
          class="btn-submit" 
          [disabled]="isLoading()"
        >
          @if (isLoading()) {
            <span class="spinner"></span>
            <span>Signing in...</span>
          } @else {
            <span>SIGN IN</span>
          }
        </button>
      </form>

      <!-- Quick Role Fill Bar for Fast Evaluation -->
      <div class="demo-bar">
        <span class="demo-title">Quick Role Login:</span>
        <div class="demo-chips">
          <button type="button" class="chip chip-admin" (click)="fillDemo('admin', 'Admin@123')">
            Admin
          </button>
          <button type="button" class="chip chip-mgr" (click)="fillDemo('manager', 'Manager@123')">
            Manager
          </button>
          <button type="button" class="chip chip-emp" (click)="fillDemo('employee', 'Employee@123')">
            Employee
          </button>
        </div>
      </div>

    </div>
  </div>
</div>
