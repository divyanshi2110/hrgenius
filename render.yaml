services:
  - type: web
    name: hrgenius-backend
    env: docker
    dockerfilePath: hrgenius-backend/Dockerfile
    dockerContext: hrgenius-backend
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 8081
      - key: SPRING_PROFILES_ACTIVE
        value: cloud
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:4200,https://*.vercel.app,https://*.netlify.app,https://*.onrender.com"
